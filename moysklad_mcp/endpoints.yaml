- operation_id: ms_stock_current
  section: reports
  method: GET
  host: api.moysklad.ru
  path: /api/remap/1.2/report/stock/all/current
  scope: ''
  safety: read
  summary: Short current stock report, grouped by product. Fast everyday call. Returns a flat array of
    {assortmentId, stock|quantity|...}. Use stockType=quantity|reserve|inTransit|stock and include=zeroLines.
  pagination: none
  items_path: ''
  rate_limit: standard weight; bucket 45/3s LIVE-confirmed 2026-06-25 (window 3000ms; not the 22/3s user-token
    tier)
  doc: https://github.com/moysklad/api-remap-1.2-doc/blob/master/md/reports/_report_stock.md
  keywords:
  - остатки
  - остаток
  - склад
  - запас
  - наличие
  - сколько
  - текущие
  - current
  - stock
- operation_id: ms_stock_all
  section: reports
  method: GET
  host: api.moysklad.ru
  path: /api/remap/1.2/report/stock/all
  scope: ''
  safety: read
  summary: Extended stock report with full product detail (prices, images). Heavy and slow — meant for
    periodic full sync, not frequent polling. Prices in kopecks. Paginated via limit/offset, rows under
    "rows".
  pagination: offset
  items_path: rows
  rate_limit: 'HEAVY: 5 limit-units/request LIVE-confirmed 2026-06-25 (45->40 on a 45-bucket). Prefer
    ms_stock_current for everyday.'
  doc: https://github.com/moysklad/api-remap-1.2-doc/blob/master/md/reports/_report_stock.md
  keywords:
  - остатки
  - расширенный
  - полный
  - синхронизация
  - выгрузка
  - stock
  - all
